name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint (optional)
        run: npm run lint || echo "No lint script found, skipping"

      - name: Run tests (with mocks)
        run: npm test || echo "No test script found, skipping"
        env:
          AMAZON_CLIENT_ID: fake_client_id
          AMAZON_CLIENT_SECRET: fake_secret
          AMAZON_REFRESH_TOKEN: fake_refresh_token
          NODE_ENV: test

      - name: Build project (if needed)
        run: npm run build || echo "No build script found, skipping"

  cd:
    name: Continuous Delivery
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            docker stop spapi-container || true
            docker rm spapi-container || true
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            docker run -d \
              --name spapi-container \
              -p 3000:3000 \
              --restart unless-stopped \
              -e AMAZON_CLIENT_ID=${{ secrets.AMAZON_CLIENT_ID }} \
              -e AMAZON_CLIENT_SECRET=${{ secrets.AMAZON_CLIENT_SECRET }} \
              -e AMAZON_REFRESH_TOKEN=${{ secrets.AMAZON_REFRESH_TOKEN }} \
              -e AWS_REGION=${{ secrets.AWS_REGION }} \
              -e DEFAULT_MARKETPLACE_ID=${{ secrets.DEFAULT_MARKETPLACE_ID }} \
              ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:latest
