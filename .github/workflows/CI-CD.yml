cd:
  name: Continuous Delivery
  if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  needs: ci
  runs-on: ubuntu-latest
  permissions:
    contents: read
    packages: write

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set lowercase image name
      id: image_name
      run: echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ steps.image_name.outputs.image_name }}:latest
          ghcr.io/${{ steps.image_name.outputs.image_name }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to production server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          docker stop spapi-container || true
          docker rm spapi-container || true
          docker pull ghcr.io/${{ steps.image_name.outputs.image_name }}:latest
          docker run -d \
            --name spapi-container \
            -p 3000:3000 \
            --restart unless-stopped \
            -e AMAZON_CLIENT_ID=${{ secrets.AMAZON_CLIENT_ID }} \
            -e AMAZON_CLIENT_SECRET=${{ secrets.AMAZON_CLIENT_SECRET }} \
            -e AMAZON_REFRESH_TOKEN=${{ secrets.AMAZON_REFRESH_TOKEN }} \
            -e AWS_REGION=${{ secrets.AWS_REGION }} \
            -e DEFAULT_MARKETPLACE_ID=${{ secrets.DEFAULT_MARKETPLACE_ID }} \
            ghcr.io/${{ steps.image_name.outputs.image_name }}:latest
